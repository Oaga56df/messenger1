<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在连接 WhatsApp...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 30px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 320px;
            width: 90%;
        }
        .loading-icon {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #25D366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text-main {
            font-size: 18px;
            color: #1c1e21;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .text-sub {
            font-size: 14px;
            color: #606770;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            background-color: #25D366;
            color: white;
            padding: 14px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:active {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="loading-icon"></div>
    <div class="text-main">正在为您跳转</div>
    <div class="text-sub">如未自动跳转，请点击下方按钮</div>
    
    <a href="https://wa.me/60102148938?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E5%BE%88%E9%AB%98%E5%85%B4%E8%AE%A4%E8%AF%86%E6%82%A8%E3%80%82" class="btn" id="wa-link">
        通过 WhatsApp 对话
    </a>
</div>

<script>
    window.onload = function() {
        const waUrl = document.getElementById('wa-link').href;
        
        // 尝试自动执行跳转
        setTimeout(function() {
            window.location.href = waUrl;
        }, 500); // 延迟0.5秒给页面渲染时间，提升成功率
    };
</script>

</body>
</html>
