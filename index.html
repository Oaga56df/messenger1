<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connecting to WhatsApp...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        /* 加载旋转圈 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #25D366;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-text { margin-top: 20px; font-size: 18px; font-weight: 500; }
        .sub-text { margin-top: 10px; font-size: 14px; color: #888; }

        /* iOS 专用引导遮罩 */
        #ios-guide {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }
        .arrow-hint {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 40px;
            color: #25D366;
        }
        .guide-box {
            width: 85%;
            border: 2px dashed #25D366;
            padding: 20px;
            border-radius: 15px;
            background: #f0fff4;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="status-text">正在为您匹配交友对象...</div>
    <div class="sub-text">请稍等，正在跳转至 WhatsApp</div>

    <div id="ios-guide">
        <div class="arrow-hint">↗️</div>
        <div class="guide-box">
            <h2 style="color: #25D366; margin-top: 0;">温馨提示</h2>
            <p>请点击右上角三个点 <strong>“···”</strong></p>
            <p>选择 <strong>“在浏览器中打开”</strong></p>
            <p style="font-size: 13px; color: #666;">（Open in Safari / Browser）</p>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
            <p style="font-size: 14px;">这样可以更稳定地联系到对方哦！</p>
        </div>
    </div>

    <script>
        (function() {
            // 配置你的链接
            const waUrl = "https://wa.me/60102148938?text=%E4%BD%A0%E5%A5%BD%EF%BC%8C%E5%BE%88%E9%AB%98%E5%85%B4%E8%AE%A4%E8%AF%86%E6%82%A8%E3%80%82";
            const ua = navigator.userAgent || navigator.vendor || window.opera;

            // 环境判断
            const isFacebook = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
            const isAndroid = /Android/i.test(ua);
            const isIos = /iPhone|iPad|iPod/i.test(ua);

            if (isFacebook) {
                if (isAndroid) {
                    // Android 强制调起外部浏览器
                    const intentUrl = "intent://" + waUrl.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
                    window.location.href = intentUrl;
                    
                    // 备用方案：如果500ms没跳走，直接跳转
                    setTimeout(() => { window.location.href = waUrl; }, 500);
                } else if (isIos) {
                    // iOS 显示引导遮罩
                    document.getElementById('ios-guide').style.display = 'flex';
                    // 同时尝试直接触发唤醒
                    window.location.href = waUrl;
                }
            } else {
                // 非FB环境（已经是外部浏览器），直接跳转
                window.location.href = waUrl;
            }
        })();
    </script>
</body>
</html>
